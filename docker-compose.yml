# ═══════════════════════════════════════════════════════════════
#  UEL Rover 실행 구성
#
#  구조:
#    OpenRB-150(펌웨어) ─USB시리얼─ micro_ros_agent ─DDS─ uel_rover 노드
#
#  - micro_ros_agent : OpenRB-150 시리얼 ↔ ROS2 토픽 브릿지
#  - uel_rover       : odom_publisher, mode_manager (DDS로만 통신)
# ═══════════════════════════════════════════════════════════════

services:

  # ── Zenoh 브릿지 (젯슨 DDS 그래프 ↔ 개발PC 무선 링크) ──────────
  #   RMW는 그대로 DDS. 이 브릿지가 로컬 DDS(ROS_DOMAIN_ID=0) 그래프를
  #   발견해 tcp/7447로 노출 → 개발PC의 zenoh_bridge가 여기로 접속한다.
  #   (micro_ros_agent가 DDS 네이티브라 RMW를 Zenoh로 못 바꾸므로,
  #    RMW는 DDS로 유지하고 머신 경계에서만 Zenoh로 브릿지)
  zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest   # 실기에서 버전 고정 권장
    container_name: zenoh_bridge
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
    command: ["-l", "tcp/0.0.0.0:7447"]
    restart: unless-stopped

  # ── micro-ROS Agent (OpenRB-150 ↔ ROS2 브릿지) ──────────────
  micro_ros_agent:
    image: microros/micro-ros-agent:jazzy
    container_name: micro_ros_agent
    command: serial --dev /dev/ttyACM0 -b 115200
    devices:
      - /dev/ttyACM0:/dev/ttyACM0   # OpenRB-150 USB 포트 (실제 포트 확인 필요)
    network_mode: host
    restart: unless-stopped

  # ── UEL Rover 제어 + Nav2 + RealSense ────────────────────────
  uel_rover:
    build: .
    image: uel_rover:jazzy
    container_name: uel_rover
    depends_on:
      - micro_ros_agent
      - zenoh_bridge
    network_mode: host
    privileged: true            # RealSense USB 접근용
    environment:
      - ROS_DOMAIN_ID=0
    volumes:
      - ./src:/ros2_ws/src
      - /dev:/dev               # RealSense D455 USB3 장치 접근
      - ./maps:/maps
    stdin_open: true
    tty: true
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        source /ros2_ws/install/setup.bash &&
        ros2 launch uel_rover_control mapping.launch.py
      "
