# ros_gz_bridge 설정: 로버 위 착륙 플랫폼 (월드 rover_landing, 합친 모델 rover_platform)
# 플랫폼/드론 토픽의 ROS 이름은 고정 플랫폼(bridge.yaml)과 같다 -> landing_controller, plate_coupler 그대로 사용.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# ---- 플랫폼 조인트 상태 (floor_joint, plate_*_joint): 합칠 때 토픽을 명시함 ----
- ros_topic_name: /joint_states
  gz_topic_name: /model/landing_platform/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# ---- 드론 조인트 상태 ----
- ros_topic_name: /drone/joint_states
  gz_topic_name: /world/rover_landing/model/simple_drone/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# ---- 플레이트 위치 명령 (rad, 대기 = 0) ----
- ros_topic_name: /platform/plate_px_joint/cmd_pos
  gz_topic_name: /model/landing_platform/joint/plate_px_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /platform/plate_mx_joint/cmd_pos
  gz_topic_name: /model/landing_platform/joint/plate_mx_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /platform/plate_py_joint/cmd_pos
  gz_topic_name: /model/landing_platform/joint/plate_py_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /platform/plate_my_joint/cmd_pos
  gz_topic_name: /model/landing_platform/joint/plate_my_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

