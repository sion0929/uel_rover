# ═══════════════════════════════════════════════════════════════
#  위치추정 모드 오버레이 — map_server + AMCL (+ static global costmap 정의)
#  localization.launch.py에서 map_server / amcl 노드에 로드된다.
# ═══════════════════════════════════════════════════════════════

# ── 저장맵 서버 ─────────────────────────────────────────────────
map_server:
  ros__parameters:
    yaml_filename: ""          # localization.launch.py의 map:= 인자로 주입
    topic_name: "map"
    frame_id: "map"

# ── AMCL 위치추정 (map→odom TF 제공) ────────────────────────────
amcl:
  ros__parameters:
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: "scan"
    laser_model_type: "likelihood_field"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.15
    update_min_a: 0.2
    laser_max_range: 6.0
    laser_min_range: 0.1
    max_beams: 60
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    transform_tolerance: 0.5
    tf_broadcast: true

# ── global_costmap: rolling → static (저장맵 사용) ──────────────
#  ※ v1 한계(설계 §3.2): 실제 global_costmap은 planner_server 안에 있고
#    planner_server는 bringup_common에서 nav2_params.yaml만 로드하므로,
#    아래 블록은 현재 어떤 노드에도 적용되지 않는다(비활성). 저장맵 기반
#    전역계획을 켜려면 이 오버레이를 planner/controller에도 전달해야 함.
#    v1의 목표주행(AMCL 위치추정 + rolling costmap)은 이대로 성립.
global_costmap:
  global_costmap:
    ros__parameters:
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
