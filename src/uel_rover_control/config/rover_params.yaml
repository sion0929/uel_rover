# ═══════════════════════════════════════════════════════════════
#  UEL Rover 파라미터 설정
# ═══════════════════════════════════════════════════════════════

odom_publisher:
  ros__parameters:
    wheel_base:    0.30    # [m] 좌우 바퀴 중심 간격 (실측 후 수정)
    wheel_radius:  0.065   # [m] 바퀴 반지름 (실측 후 수정)

# ── 포트 설정 ──────────────────────────────────────────────────
# OpenRB-150 → Jetson Orin USB: /dev/ttyACM0
# micro-ROS Agent 실행:
#   docker compose up micro_ros_agent
