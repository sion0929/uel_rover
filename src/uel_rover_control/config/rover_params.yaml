# ═══════════════════════════════════════════════════════════════
#  UEL Rover 파라미터 설정
# ═══════════════════════════════════════════════════════════════

odom_publisher:
  ros__parameters:
    wheel_base:    0.915   # [m] 유효 트랙폭(skid-steer scrub): 1차 0.981→5바퀴 실측 1678.6°/1800° 재보정
    wheel_radius:  0.0877   # [m] 바퀴 반지름 (실측 후 수정)

# ── 포트 설정 ──────────────────────────────────────────────────
# OpenRB-150 → Jetson Orin USB: /dev/ttyACM0
# micro-ROS Agent 실행:
#   docker compose up micro_ros_agent
