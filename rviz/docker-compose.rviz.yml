services:
  # ── Zenoh 브릿지 (개발PC측) ────────────────────────────────────
  #   젯슨의 zenoh_bridge(tcp/192.168.0.112:7447)로 접속해, 젯슨의
  #   ROS2 토픽을 개발PC 로컬 DDS 그래프(ROS_DOMAIN_ID=0)로 재주입한다.
  #   rviz2는 이 로컬 DDS 그래프를 그냥 구독한다.
  zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest   # 젯슨과 동일 태그 사용(프로토콜 일치)
    container_name: uel_rover_zenoh_bridge
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
    command: ["-e", "tcp/192.168.0.112:7447"]
    restart: unless-stopped

  # ── rviz2 (기본 DDS로 로컬 그래프 구독) ────────────────────────
  rviz2:
    build:
      context: .
      dockerfile: Dockerfile.rviz
    image: uel_rover_rviz:jazzy
    container_name: uel_rover_rviz
    network_mode: host
    depends_on:
      - zenoh_bridge
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/config
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
               rviz2 -d /config/uel_rover.rviz"
